name: Build image

# Builds one image (one version line and variant) per architecture on native runners, tests and scans it.
# Pushes nothing: release.yaml pushes, and only when the build is a release.
# Callers with several images call this workflow once per image, in a matrix.
# Results go to the artifact facts__<image-key>__<arch>; release.yaml reads them.

on:
  workflow_call:
    inputs:
      image-key:
        description: Key of this image in versions.lock, e.g. 3.14-dev or alpine. Letters, digits, dot and dash only.
        type: string
        required: true
      context:
        description: Build context, relative to the caller's repository root.
        type: string
        default: "."
      file:
        description: Dockerfile path, relative to the caller's repository root.
        type: string
        default: Dockerfile
      target:
        description: Dockerfile stage to build. Empty builds the last stage.
        type: string
        default: ""
      build-contexts:
        description: Named build contexts, one per line (e.g. pins the base image digest).
        type: string
        default: ""
      build-args:
        description: Build arguments, one per line.
        type: string
        default: ""
      version-command:
        description: Shell command run in the image that prints its upstream version.
        type: string
        default: cat /etc/alpine-release
      test-script:
        description: Executable test entry point in the caller's repository. Receives $IMAGE and $IMAGE_KEY.
        type: string
        default: tests/run.sh

permissions: {}

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  build:
    name: Build and test (${{ inputs.image-key }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      LOCAL_IMAGE: local/image-under-test:${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - name: Validate inputs
        env:
          IMAGE_KEY: ${{ inputs.image-key }}
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          if ! printf '%s\n' "$IMAGE_KEY" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*$'; then
            echo "::error::image-key '$IMAGE_KEY' may only contain letters, digits, dot and dash"
            exit 1
          fi
          case "$TEST_SCRIPT" in
            /* | *..*) echo "::error::test-script must be a relative path inside the repository"; exit 1 ;;
          esac

      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .container-workflows

      - name: Check test script
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          if [ ! -x "$TEST_SCRIPT" ]; then
            echo "::error::$TEST_SCRIPT is missing or not executable"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          build-contexts: ${{ inputs.build-contexts }}
          build-args: ${{ inputs.build-args }}
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ github.repository }}-${{ inputs.image-key }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}-${{ inputs.image-key }}-${{ matrix.arch }}

      - name: Test
        env:
          IMAGE: ${{ env.LOCAL_IMAGE }}
          IMAGE_KEY: ${{ inputs.image-key }}
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: ./"$TEST_SCRIPT"

      - name: Scan (report)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/out"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            -v "$RUNNER_TEMP/out:/out" \
            "$TRIVY_IMAGE" image --scanners vuln --format sarif --output /out/trivy.sarif "$LOCAL_IMAGE"

      - name: Upload scan results
        # Forks get no security-events permission.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/out/trivy.sarif
          category: build-${{ inputs.image-key }}-${{ matrix.arch }}

      - name: Scan (gate on fixable critical vulnerabilities)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$LOCAL_IMAGE"

      - name: Record image facts
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_KEY: ${{ inputs.image-key }}
          VERSION_COMMAND: ${{ inputs.version-command }}
        run: |
          sh .container-workflows/scripts/image-facts.sh "$LOCAL_IMAGE" "$VERSION_COMMAND" > "$RUNNER_TEMP/facts.env"
          jq -n \
            --arg key "$IMAGE_KEY" \
            --arg platform "$PLATFORM" \
            --arg alpine "$(sed -n 's/^alpine-version=//p' "$RUNNER_TEMP/facts.env")" \
            --arg packages "$(sed -n 's/^packages-sha256=//p' "$RUNNER_TEMP/facts.env")" \
            --arg upstream "$(sed -n 's/^upstream-version=//p' "$RUNNER_TEMP/facts.env")" \
            '{key: $key, platform: $platform, alpineVersion: $alpine, packagesSha256: $packages, upstreamVersion: $upstream}' \
            > "$RUNNER_TEMP/facts.json"

      - name: Upload image facts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # "__" separates key and arch, so key 3.14 never matches artifacts of key 3.14-dev.
          name: facts__${{ inputs.image-key }}__${{ matrix.arch }}
          path: ${{ runner.temp }}/facts.json
          retention-days: 1

  check:
    name: Check facts (${{ inputs.image-key }})
    runs-on: ubuntu-24.04
    needs: build
    permissions: {}
    steps:
      - name: Download image facts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: facts__${{ inputs.image-key }}__*
          path: facts

      - name: Same Alpine and upstream version on every architecture
        run: |
          count=$(jq -s 'length' facts/*/facts.json)
          distinct=$(jq -s '[.[] | {alpineVersion, upstreamVersion}] | unique | length' facts/*/facts.json)
          if [ "$count" -ne 2 ] || [ "$distinct" -ne 1 ]; then
            echo "::error::Expected 2 architectures with identical versions:"
            jq -s -c '.' facts/*/facts.json
            exit 1
          fi
