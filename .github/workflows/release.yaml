name: Release image

# Decides whether a tested build is a release (scripts/semver-level.sh), records it in versions.lock
# and a git tag, then pushes, signs and tags the image.
#
# Order matters: the git commit and tag come first, registry tags last. A run that fails after the
# git push is resumed by the next run (mode "resume"), because the immutable image tag is still missing.

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, e.g. ghcr.io/owner/alpine-minimal.
        type: string
        required: true
      context:
        description: Same build context as given to build-image.yaml.
        type: string
        default: "."
      file:
        description: Same Dockerfile as given to build-image.yaml.
        type: string
        default: Dockerfile
      build-contexts:
        description: Same named build contexts as given to build-image.yaml.
        type: string
        default: ""
      build-args:
        description: Same build arguments as given to build-image.yaml.
        type: string
        default: ""
      test-script:
        description: Same test entry point as given to build-image.yaml; run again against the pushed image.
        type: string
        default: tests/run.sh
      alpine-version:
        description: build-image.yaml output alpine-version.
        type: string
        required: true
      alpine-digest:
        description: Digest of the upstream alpine image the build was pinned to.
        type: string
        required: true
      packages-json:
        description: build-image.yaml output packages-json.
        type: string
        required: true
      level:
        description: Raise the computed SemVer level to at least this one (none|patch|minor|major).
        type: string
        default: none
      release-paths:
        description: Space-separated paths whose changes since the last release count as a patch.
        type: string
        default: Dockerfile rootfs
      tag-suffix:
        description: Appended to every upstream tag, e.g. "-fpm". Empty for alpine-minimal.
        type: string
        default: ""

permissions: {}

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  HEARTBEAT_AFTER_SECONDS: "2592000"

jobs:
  decide:
    name: Decide release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      level: ${{ steps.level.outputs.level }}
      version: ${{ steps.level.outputs.version }}
      reason: ${{ steps.level.outputs.reason }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .container-workflows

      - name: Skip when a newer commit exists
        id: head
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$RUN_SHA" ]; then
            echo "::notice::$RUN_SHA is no longer the head of the default branch; the newer run releases."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"

      - name: Compute level
        id: level
        if: steps.head.outputs.stale == 'false'
        env:
          ALPINE_VERSION: ${{ inputs.alpine-version }}
          ALPINE_DIGEST: ${{ inputs.alpine-digest }}
          PACKAGES_JSON: ${{ inputs.packages-json }}
          LEVEL: ${{ inputs.level }}
          RELEASE_PATHS: ${{ inputs.release-paths }}
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          files_changed=true
          # shellcheck disable=SC2086 # RELEASE_PATHS is a space-separated list on purpose
          if [ -n "$last_tag" ] && git diff --quiet "$last_tag" HEAD -- $RELEASE_PATHS; then
            files_changed=false
          fi
          sh .container-workflows/scripts/semver-level.sh versions.lock \
            "$ALPINE_VERSION" "$ALPINE_DIGEST" "$PACKAGES_JSON" "$files_changed" "$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Decide mode
        id: mode
        if: steps.head.outputs.stale == 'false'
        env:
          IMAGE: ${{ inputs.image }}
          LEVEL: ${{ steps.level.outputs.level }}
          VERSION: ${{ steps.level.outputs.version }}
          TAG_BASE: ${{ inputs.alpine-version }}
          TAG_SUFFIX: ${{ inputs.tag-suffix }}
        run: |
          if [ "$LEVEL" != "none" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          immutable_tag="$TAG_BASE$TAG_SUFFIX-$VERSION"
          if docker buildx imagetools inspect "$IMAGE:$immutable_tag" > /dev/null 2>&1; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::Release $VERSION is recorded but $IMAGE:$immutable_tag is missing; resuming."
          echo "mode=resume" >> "$GITHUB_OUTPUT"

      - name: Heartbeat
        # GitHub disables scheduled workflows in public repos after 60 days without activity.
        if: steps.mode.outputs.mode == 'none'
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt "$HEARTBEAT_AFTER_SECONDS" ]; then
            exit 0
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit --allow-empty -m "Keep scheduled workflows active"
          git push origin HEAD

  record:
    name: Record release
    runs-on: ubuntu-24.04
    needs: decide
    if: needs.decide.outputs.mode == 'release'
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Write versions.lock, commit and tag
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          LEVEL: ${{ needs.decide.outputs.level }}
          REASON: ${{ needs.decide.outputs.reason }}
          ALPINE_VERSION: ${{ inputs.alpine-version }}
          ALPINE_DIGEST: ${{ inputs.alpine-digest }}
          PACKAGES_JSON: ${{ inputs.packages-json }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          jq -n --arg version "$VERSION" --arg alpine "$ALPINE_VERSION" --arg digest "$ALPINE_DIGEST" \
            --argjson packages "$PACKAGES_JSON" \
            '{version: $version, alpineVersion: $alpine, alpineDigest: $digest, packages: $packages}' > versions.lock
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add versions.lock
          git commit -m "Release $VERSION" -m "- Level: $LEVEL" -m "- Reason: $REASON"
          git tag "v$VERSION"
          # Atomic: either branch and tag land together, or neither does (e.g. main moved meanwhile).
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$VERSION"

  push:
    name: Push (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [decide, record]
    if: >-
      always()
      && (needs.decide.outputs.mode == 'release' || needs.decide.outputs.mode == 'resume')
      && (needs.record.result == 'success' || needs.record.result == 'skipped')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .container-workflows

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ matrix.platform }}
          build-contexts: ${{ inputs.build-contexts }}
          build-args: ${{ inputs.build-args }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: false
          cache-from: type=gha,scope=${{ github.repository }}-${{ matrix.arch }}

      - name: Verify pushed image equals the tested one
        env:
          IMAGE_REF: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          PACKAGES_JSON: ${{ inputs.packages-json }}
          ALPINE_VERSION: ${{ inputs.alpine-version }}
        run: |
          sh .container-workflows/scripts/image-facts.sh "$IMAGE_REF" > "$RUNNER_TEMP/facts.env"
          expected=$(printf '%s' "$PACKAGES_JSON" | jq -r --arg p "$PLATFORM" '.[$p]')
          actual=$(sed -n 's/^packages-sha256=//p' "$RUNNER_TEMP/facts.env")
          actual_alpine=$(sed -n 's/^alpine-version=//p' "$RUNNER_TEMP/facts.env")
          if [ "$expected" != "$actual" ] || [ "$ALPINE_VERSION" != "$actual_alpine" ]; then
            echo "::error::Pushed image differs from the tested build (packages $actual vs $expected, Alpine $actual_alpine vs $ALPINE_VERSION)"
            exit 1
          fi

      - name: Test pushed image
        env:
          IMAGE: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: ./"$TEST_SCRIPT"

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          retention-days: 1

  publish:
    name: Tag, sign and publish
    runs-on: ubuntu-24.04
    needs: [decide, push]
    if: always() && needs.push.result == 'success'
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ needs.decide.outputs.version }}
      ALPINE_VERSION: ${{ inputs.alpine-version }}
      TAG_SUFFIX: ${{ inputs.tag-suffix }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Create tags
        id: tags
        run: |
          minor=${ALPINE_VERSION%.*}
          major=${ALPINE_VERSION%%.*}
          immutable="$ALPINE_VERSION$TAG_SUFFIX-$VERSION"
          if docker buildx imagetools inspect "$IMAGE:$immutable" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$immutable already exists; refusing to overwrite an immutable tag"
            exit 1
          fi
          set -- \
            -t "$IMAGE:$immutable" \
            -t "$IMAGE:$ALPINE_VERSION$TAG_SUFFIX" \
            -t "$IMAGE:$minor$TAG_SUFFIX" \
            -t "$IMAGE:$major$TAG_SUFFIX"
          for f in digests/*; do
            set -- "$@" "$IMAGE@$(cat "$f")"
          done
          docker buildx imagetools create "$@"
          digest=$(docker buildx imagetools inspect "$IMAGE:$immutable" --format '{{json .Manifest}}' | jq -r '.digest')
          {
            echo "digest=$digest"
            echo "immutable=$immutable"
            echo "list=$ALPINE_VERSION$TAG_SUFFIX, $minor$TAG_SUFFIX, $major$TAG_SUFFIX, $immutable"
          } >> "$GITHUB_OUTPUT"

      - name: Sign and attest
        env:
          DIGEST: ${{ steps.tags.outputs.digest }}
        run: |
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/out"
          for format in cyclonedx cosign-vuln; do
            docker run --rm \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
              -v "$RUNNER_TEMP/out:/out" \
              "$TRIVY_IMAGE" image --scanners vuln --format "$format" --output "/out/$format.json" "$ref"
          done
          cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/out/cyclonedx.json" "$ref"
          cosign attest --yes --type vuln --predicate "$RUNNER_TEMP/out/cosign-vuln.json" "$ref"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEVEL: ${{ needs.decide.outputs.level }}
          REASON: ${{ needs.decide.outputs.reason }}
          ALPINE_DIGEST: ${{ inputs.alpine-digest }}
          DIGEST: ${{ steps.tags.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::notice::GitHub Release v$VERSION already exists."
            exit 0
          fi
          notes=$(cat <<EOF
          - Alpine: $ALPINE_VERSION (upstream digest \`$ALPINE_DIGEST\`)
          - Level: $LEVEL ($REASON)
          - Image: \`$IMAGE@$DIGEST\`
          - Tags: $TAGS
          EOF
          )
          gh release create "v$VERSION" --title "$VERSION (Alpine $ALPINE_VERSION)" --notes "$notes"
